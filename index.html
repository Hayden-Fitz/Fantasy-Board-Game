<!DOCTYPE html>

<html>

<head>

    <title>Fantasy Board Game</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ======================
     MAIN MENU
====================== -->

<div id="mainMenu">

    <h1>Fantasy Board Game</h1>


    <input 
    id="playerName"
    placeholder="Your name"
    >


    <br><br>


    <button onclick="createGame()">
        Create Game
    </button>


    <button onclick="showJoinScreen()">
        Join Game
    </button>


</div>




<!-- ======================
     JOIN SCREEN
====================== -->


<div id="joinScreen" style="display:none">


    <h1>Join Game</h1>


    <input
    id="gameCode"
    placeholder="Game Code"
    oninput="this.value=this.value.toUpperCase()"
    >


    <button onclick="joinGame()">
        Join
    </button>



    <h2>
        Public Games
    </h2>


    <div id="publicGames">

    </div>



    <br>


    <button onclick="returnMainMenu()">
        Return
    </button>


</div>





<!-- ======================
     LOBBY
====================== -->


<div id="lobbyScreen" style="display:none">



    <div id="lobbyLeft">


        <h1>
            Lobby
        </h1>


        <h3 id="status"></h3>



        <select 
        id="kingdom"
        onchange="changeKingdom()">


            <option>
                Crimson Empire
            </option>


            <option>
                Tide Kingdom
            </option>


            <option>
                Culinary Kingdom
            </option>


            <option>
                Viking Kingdom
            </option>


            <option>
                Shadow Kingdom
            </option>


        </select>



        <br><br>



        <button onclick="readyUp()">

            I'm Ready

        </button>




        <div id="hostControls" style="display:none">


            <br>


            <label>

                <input 
                type="checkbox"
                id="publicGame"
                onchange="updatePublicSetting()"
                >

                Public Game

            </label>



            <br><br>



            <button onclick="checkStartGame()">

                Start Game

            </button>



            <button onclick="deleteGame()">

                Delete Game

            </button>


        </div>



    </div>




    <div id="lobbyPlayers">


        <h2>
            Players
        </h2>



        <div id="playerList">

        </div>



    </div>



</div>




<script type="module" src="lobby.js"></script>


</body>

</html>
